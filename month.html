<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Mothiversary 💕</title>
<style>
:root{--bg:#fff5f7;--card:#fff;--text:#4a2733;--muted:#9a6b79;--accent:#e0457b;--accent2:#ff8fb1;--line:#f6d3de}
@media (prefers-color-scheme:dark){:root{--bg:#1c1015;--card:#2a1820;--text:#fbe6ee;--muted:#c79aab;--accent:#ff6b9d;--accent2:#b8326a;--line:#40242f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif;min-height:100vh;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:560px;margin:0 auto;padding:24px 18px 48px;position:relative;z-index:2}
h1{font-size:2rem;text-align:center;margin:8px 0 4px;color:var(--accent)}
.sub{text-align:center;color:var(--muted);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 8px 30px rgba(224,69,123,.12)}
.hidden{display:none}
.big{font-size:4.5rem;text-align:center;line-height:1;margin:6px 0;color:var(--accent);font-weight:bold;cursor:pointer}
.big small{display:block;font-size:1rem;color:var(--muted);font-weight:normal;margin-top:6px}
video{width:100%;border-radius:16px;margin:16px 0;background:#000;max-height:60vh}
.note{background:var(--bg);border-left:4px solid var(--accent);border-radius:12px;padding:14px 16px;margin:10px 0;line-height:1.55;font-size:1.05rem;opacity:0;transform:translateY(12px);transition:.7s}
.note.show{opacity:1;transform:none}
.sig{text-align:right;color:var(--accent);font-style:italic;margin-top:14px;font-size:1.1rem}
.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin:18px 0}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border:6px solid #fff;border-radius:6px;box-shadow:0 6px 16px rgba(0,0,0,.18);transform:rotate(var(--r)) scale(.9);opacity:0;transition:.7s}
.photos img.show{opacity:1;transform:rotate(var(--r))}
.gift{text-align:center;margin:26px 0 10px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.gift .box{font-size:5.5rem;display:inline-block;animation:bob 1.6s ease-in-out infinite}
.gift p{color:var(--accent);margin:4px 0 0;font-style:italic}
.gift.open .box{animation:pop .9s forwards}
@keyframes bob{50%{transform:translateY(-8px) rotate(-5deg)}}
@keyframes pop{30%{transform:scale(1.35) rotate(10deg)}100%{transform:scale(0);opacity:0}}
.heart{position:fixed;bottom:-30px;z-index:1;pointer-events:none;animation:up linear forwards}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.heart{display:none}.note{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Happy Mothiversary 💕</h1>
  <p class="sub">Another month of us, wrapped in love.</p>
  <div class="card">
    <div class="big" id="num"></div>
    <p class="sub" id="head" style="margin-top:10px"></p>
    <div id="photos" class="photos"></div>
    <div id="list"></div>
    <div id="giftbox" class="gift hidden" role="button" tabindex="0" aria-label="Open your gift"><div class="box">🎁</div><p>One more thing… tap to open your gift</p></div>
    <video id="player" controls playsinline class="hidden"></video>
    <div class="sig" id="sig"></div>
  </div>
</div>
<script>
// ===== EDIT YOUR DETAILS HERE =====
const D={
  to:"Aayu", from:"Gopal", n:2,
  photos:["1.jpg","2.jpg","3.jpg","4.jpg","5.jpg"], // files in the same folder
  video:"video.mp4",
  lines:[
    "You make even the ordinary feel special.",
    "You are the one who endlessly supports me and gives me the courage to move forward. You make my life complete.",
    "I never imagined a life with such a pretty girl in every aspect. Your beauty, your smile, your blushing, your ability to listen to me and never judge, your selfless and endless love to share your every thought and even secrets with me surely makes me blessed to have you.",
    "You are the sun that shines upon me and makes my life evergreen, my dear. Thank you for choosing me and loving me the way you do.",
    "So lastly, here’s to our many, many more months, years and decades of our bond, love and relationship.",
    "I love you 3000> ;) 💋💋💋💋❤️🫂👸"
  ]
};
// ==================================
const $=id=>document.getElementById(id);
const ord=n=>{const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};
function hearts(c){
  const set=['💗','💕','💖','💘','🌸'];
  for(let i=0;i<c;i++){
    const h=document.createElement('div');h.className='heart';
    h.textContent=set[Math.floor(Math.random()*set.length)];
    h.style.left=Math.random()*100+'vw';
    h.style.fontSize=(16+Math.random()*26)+'px';
    h.style.animationDuration=(4+Math.random()*5)+'s';
    h.style.animationDelay=(Math.random()*2.5)+'s';
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),11000);
  }
}
$('num').innerHTML=ord(D.n)+'<small>Mothiversary</small>';
$('head').textContent='Happy mothiversary, '+D.to+'! 💞';
$('sig').textContent='Forever yours, '+D.from+' ♥';
D.photos.forEach((u,i)=>{
  const im=document.createElement('img');im.src=u;im.alt='Our photo';
  im.style.setProperty('--r',((i%2?1:-1)*(1+i%3))+'deg');
  $('photos').appendChild(im);
  setTimeout(()=>im.classList.add('show'),300+i*250);
});
D.lines.forEach((t,i)=>{
  const e=document.createElement('div');e.className='note';e.textContent=t;
  $('list').appendChild(e);
  setTimeout(()=>e.classList.add('show'),700+i*900);
});
setTimeout(()=>$('giftbox').classList.remove('hidden'),700+D.lines.length*900);
$('player').src=D.video;
$('giftbox').onclick=()=>{
  const g=$('giftbox');if(g.classList.contains('open'))return;
  g.classList.add('open');hearts(30);
  setTimeout(()=>{
    g.classList.add('hidden');
    const p=$('player');p.classList.remove('hidden');
    p.scrollIntoView({behavior:'smooth',block:'center'});
    p.play().catch(()=>{});
  },900);
};
$('giftbox').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('giftbox').click()}};
$('num').onclick=()=>hearts(20);
hearts(28);
</script>
</body>
</html>
